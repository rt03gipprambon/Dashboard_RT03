<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Warga RT 03 - Grand Indraprasta</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #070c18; 
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #070c18;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #22d3ee;
      font-family: sans-serif;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(34, 211, 238, 0.2);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Memuat Dashboard...</div>
  </div>

  <iframe 
    id="dashboardFrame"
    src="https://script.google.com/macros/s/AKfycbw_uiEBV9zCZoHXoPVmEnF5LlrdzAuB4cC4brbDANMiqghAKbyh7gNyI4xEat20C-XcUw/exec?authuser=0" 
    allow="fullscreen; camera; microphone"
    onload="document.getElementById('loading').style.opacity = '0'; setTimeout(function(){ document.getElementById('loading').style.display = 'none'; }, 500);">
  </iframe>

  <script>
    setInterval(function() {
      var iframe = document.getElementById('dashboardFrame');
      iframe.src = iframe.src;
    }, 30 * 60 * 1000);

    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
</body>
</html>
